<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>巴黎安全监控</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg: #05070C;
            --card: #0F131C;
            --line: #1E2636;
            --accent: #3B6DFF;
            --danger: #FF5A5A;
            --warning: #E9A568;
            --text: #E8EAED;
            --muted: #9BA1AB;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
        }

        .container { max-width: 720px; margin: 0 auto; padding: 1rem; }

        h1 { font-size: 1.5rem; margin: 0.5rem 0 0.25rem; }
        .subtitle { color: var(--muted); font-size: 0.875rem; margin-bottom: 1rem; }

        .btn {
            width: 100%;
            padding: 0.9rem;
            border: none;
            border-radius: 12px;
            background: var(--accent);
            color: #fff;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
        }
        .btn:disabled { opacity: 0.5; }

        .filters { display: flex; gap: 0.5rem; margin: 1rem 0; flex-wrap: wrap; }
        .chip {
            padding: 0.4rem 0.9rem;
            border-radius: 999px;
            border: 1px solid var(--line);
            background: var(--card);
            color: var(--muted);
            font-size: 0.85rem;
            cursor: pointer;
        }
        .chip.active { border-color: var(--accent); color: var(--text); }

        .section-title { font-size: 1rem; margin: 1.25rem 0 0.5rem; color: var(--muted); }

        .item {
            display: block;
            background: var(--card);
            border-left: 4px solid var(--line);
            border-radius: 10px;
            padding: 0.8rem 1rem;
            margin-bottom: 0.6rem;
            color: var(--text);
            text-decoration: none;
        }
        .item.high { border-left-color: var(--danger); }
        .item.medium { border-left-color: var(--warning); }
        .item-title { font-size: 0.95rem; }
        .item-meta { color: var(--muted); font-size: 0.78rem; margin-top: 0.3rem; display: flex; gap: 0.6rem; flex-wrap: wrap; }
        .tag { font-weight: 600; }
        .tag.high { color: var(--danger); }
        .tag.medium { color: var(--warning); }

        .links a {
            display: block;
            background: var(--card);
            border-radius: 10px;
            padding: 0.75rem 1rem;
            margin-bottom: 0.5rem;
            color: var(--text);
            text-decoration: none;
            font-size: 0.9rem;
        }
        .links small { color: var(--muted); display: block; }

        .notice { color: var(--muted); font-size: 0.8rem; margin-top: 1rem; }
        .status { color: var(--muted); text-align: center; padding: 1.5rem 0; }
        .error { color: var(--danger); text-align: center; padding: 1.5rem 0; }

        .login {
            position: fixed; inset: 0;
            background: var(--bg);
            display: flex; align-items: center; justify-content: center;
        }
        .login-box { width: 90%; max-width: 360px; }
        .login-box h2 { margin-bottom: 1rem; }
        .login-box input {
            width: 100%;
            padding: 0.9rem;
            margin-bottom: 0.75rem;
            border-radius: 12px;
            border: 1px solid var(--line);
            background: var(--card);
            color: var(--text);
            font-size: 1rem;
        }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div class="login" id="login">
        <form class="login-box" onsubmit="login(event)">
            <h2>🔐 输入访问密码</h2>
            <input type="password" id="password" placeholder="密码" autocomplete="current-password" required>
            <button class="btn" type="submit" id="loginBtn">进入</button>
            <div class="error hidden" id="loginError"></div>
        </form>
    </div>

    <div class="container hidden" id="main">
        <h1>🇫🇷 巴黎安全监控</h1>
        <div class="subtitle">过去 48 小时巴黎游行 / 冲突相关新闻，按时间倒序</div>

        <button class="btn" id="searchBtn" onclick="search()">🔍 查询最新信息</button>

        <div class="filters">
            <span class="chip active" data-filter="all" onclick="setFilter('all')">全部</span>
            <span class="chip" data-filter="high" onclick="setFilter('high')">🔴 冲突</span>
            <span class="chip" data-filter="medium" onclick="setFilter('medium')">🟠 游行/罢工</span>
        </div>

        <div id="results"></div>

        <div class="section-title">📌 官方实时渠道（最权威）</div>
        <div class="links">
            <a href="https://x.com/prefpolice" target="_blank" rel="noopener">
                巴黎警察局 Préfecture de Police（X）
                <small>官方发布游行路线、禁行区域、警情</small>
            </a>
            <a href="https://www.ratp.fr/infos-trafic" target="_blank" rel="noopener">
                RATP 地铁实时交通
                <small>游行时地铁站常临时关闭，出门前看这里</small>
            </a>
            <a href="https://www.prefecturedepolice.interieur.gouv.fr/actualites-et-presse" target="_blank" rel="noopener">
                巴黎警察局官网新闻
                <small>禁止示威令（arrêté）会在这里公布</small>
            </a>
        </div>

        <div class="notice">
            新闻来自 Google 新闻聚合的媒体报道，点开可看原文。红/橙色标记是按标题关键词自动判断的，只作提醒，不代表实际危险程度，以官方渠道为准。
        </div>
    </div>

    <script>
        const STORAGE_KEY = 'paris_monitor_password';
        let password = localStorage.getItem(STORAGE_KEY);
        let items = [];
        let filter = 'all';

        if (password) {
            verify(password).then(ok => ok ? showMain() : localStorage.removeItem(STORAGE_KEY));
        }

        async function verify(pwd) {
            try {
                const res = await fetch('/api/login', { method: 'POST', headers: { 'X-Password': pwd } });
                return res.ok;
            } catch {
                return false;
            }
        }

        async function login(event) {
            event.preventDefault();
            const pwd = document.getElementById('password').value;
            const btn = document.getElementById('loginBtn');
            const err = document.getElementById('loginError');
            btn.disabled = true;
            err.classList.add('hidden');

            if (await verify(pwd)) {
                password = pwd;
                localStorage.setItem(STORAGE_KEY, pwd);
                showMain();
            } else {
                err.textContent = '密码错误';
                err.classList.remove('hidden');
            }
            btn.disabled = false;
        }

        function showMain() {
            document.getElementById('login').classList.add('hidden');
            document.getElementById('main').classList.remove('hidden');
            search();
        }

        async function search() {
            const btn = document.getElementById('searchBtn');
            const results = document.getElementById('results');
            btn.disabled = true;
            btn.textContent = '查询中...';
            results.innerHTML = '<div class="status">正在获取最新新闻...</div>';

            try {
                const res = await fetch('/api/search', { method: 'POST', headers: { 'X-Password': password } });
                if (res.status === 401) {
                    localStorage.removeItem(STORAGE_KEY);
                    location.reload();
                    return;
                }
                const data = await res.json();
                if (!data.success) throw new Error(data.error || '查询失败');
                items = data.items;
                render(data.timestamp);
            } catch (e) {
                results.innerHTML = `<div class="error">⚠️ ${escapeHtml(e.message)}，请稍后重试</div>`;
            } finally {
                btn.disabled = false;
                btn.textContent = '🔍 查询最新信息';
            }
        }

        function setFilter(f) {
            filter = f;
            document.querySelectorAll('.chip').forEach(c => c.classList.toggle('active', c.dataset.filter === f));
            render();
        }

        let lastTimestamp = null;
        function render(timestamp) {
            if (timestamp) lastTimestamp = timestamp;
            const list = filter === 'all' ? items : items.filter(i => i.severity === filter);
            const results = document.getElementById('results');

            if (list.length === 0) {
                results.innerHTML = '<div class="status">✅ 过去 48 小时没有找到相关报道</div>';
            } else {
                results.innerHTML = list.map(item => `
                    <a class="item ${item.severity}" href="${escapeHtml(item.link)}" target="_blank" rel="noopener">
                        <div class="item-title">${escapeHtml(item.title)}</div>
                        <div class="item-meta">
                            ${item.severity === 'high' ? '<span class="tag high">冲突</span>' : ''}
                            ${item.severity === 'medium' ? '<span class="tag medium">游行/罢工</span>' : ''}
                            <span>${escapeHtml(item.source)}</span>
                            <span>${timeAgo(item.publishedAt)}</span>
                        </div>
                    </a>
                `).join('');
            }

            if (lastTimestamp) {
                const t = new Date(lastTimestamp).toLocaleString('zh-CN', {
                    timeZone: 'Europe/Paris', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit'
                });
                results.innerHTML += `<div class="status">更新于 ${t}（巴黎时间）</div>`;
            }
        }

        function timeAgo(iso) {
            const minutes = Math.round((Date.now() - new Date(iso)) / 60000);
            if (minutes < 60) return `${Math.max(minutes, 1)} 分钟前`;
            const hours = Math.round(minutes / 60);
            return hours < 24 ? `${hours} 小时前` : `${Math.round(hours / 24)} 天前`;
        }

        function escapeHtml(s) {
            return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        }
    </script>
</body>
</html>
