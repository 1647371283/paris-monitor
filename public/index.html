<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0A0D12">
    <title>巴黎安全监控</title>
    <style>
        :root {
            --bg: #05070C; --surface-1: #0A0D12; --surface-2: #0F131C;
            --surface-3: #161D2B; --card: #1E2636;
            --text: #E8EBF0; --muted: #8B92A6; --line: #2A3344;
            --primary: #38BDF8; --upcoming: #6EE7B7; --today: #F59E0B;
            --past: #8B92A6; --clash: #EF4444;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg); color: var(--text);
            line-height: 1.6; -webkit-font-smoothing: antialiased;
        }
        .container { max-width: 680px; margin: 0 auto; padding: 1.5rem 1rem 3rem; }
        h1 { font-size: clamp(1.5rem, 5vw, 2rem); margin-bottom: 0.25rem; }
        .subtitle { color: var(--muted); font-size: 0.875rem; margin-bottom: 1.5rem; }

        .btn {
            width: 100%; padding: 0.9rem; border: none; border-radius: 999px;
            background: var(--primary); color: #000; font-weight: 600;
            font-size: 1rem; cursor: pointer; transition: opacity 0.2s;
            margin-bottom: 1.5rem;
        }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .event-card {
            background: var(--surface-2);
            border: 1px solid var(--line);
            border-radius: 16px;
            padding: 1.25rem;
            margin-bottom: 1rem;
        }
        .event-card.upcoming { border-left: 4px solid var(--upcoming); }
        .event-card.today { border-left: 4px solid var(--today); }
        .event-card.past { border-left: 4px solid var(--past); }

        .event-header { display: flex; justify-content: space-between; align-items: start; margin-bottom: 0.75rem; }
        .event-date { font-size: 1.125rem; font-weight: 600; }
        .event-badge {
            padding: 0.25rem 0.75rem; border-radius: 999px;
            font-size: 0.75rem; font-weight: 600;
        }
        .event-badge.upcoming { background: rgba(110, 231, 183, 0.15); color: var(--upcoming); }
        .event-badge.today { background: rgba(245, 158, 11, 0.15); color: var(--today); }
        .event-badge.past { background: rgba(139, 146, 166, 0.15); color: var(--past); }

        .event-meta { display: flex; gap: 1rem; flex-wrap: wrap; color: var(--muted); font-size: 0.875rem; margin-bottom: 0.5rem; }
        .places { color: var(--text); font-size: 0.875rem; margin-bottom: 0.75rem; }
        .places strong { color: var(--primary); }

        .article {
            background: var(--card);
            padding: 0.75rem;
            border-radius: 10px;
            margin-bottom: 0.5rem;
        }
        .article-link {
            display: block; text-decoration: none; color: var(--text);
        }
        .article-title { font-weight: 500; margin-bottom: 0.25rem; line-height: 1.4; }
        .article-title.clash { color: var(--clash); }
        .article-meta { display: flex; justify-content: space-between; align-items: center; font-size: 0.8rem; color: var(--muted); }

        .latest-section { margin-top: 2rem; }
        .section-title { font-size: 1.125rem; font-weight: 600; margin-bottom: 1rem; color: var(--muted); }

        .official-links {
            margin-top: 2rem;
            padding: 1.25rem;
            background: var(--surface-2);
            border-radius: 16px;
            border: 1px solid var(--line);
        }
        .official-links a {
            display: block; padding: 0.75rem; margin-bottom: 0.5rem;
            background: var(--card); border-radius: 10px;
            text-decoration: none; color: var(--text);
            font-size: 0.875rem;
        }
        .official-links a:last-child { margin-bottom: 0; }
        .official-links small { display: block; color: var(--muted); margin-top: 0.25rem; }

        .notice { color: var(--muted); font-size: 0.8rem; margin-top: 1.5rem; line-height: 1.5; }
        .status, .error { text-align: center; padding: 2rem 0; }
        .error { color: var(--clash); }

        .login {
            position: fixed; inset: 0; background: var(--bg);
            display: flex; align-items: center; justify-content: center;
        }
        .login-box { width: 90%; max-width: 360px; }
        .login-box h2 { margin-bottom: 1rem; }
        .login-box input {
            width: 100%; padding: 0.9rem; margin-bottom: 0.75rem;
            border-radius: 12px; border: 1px solid var(--line);
            background: var(--card); color: var(--text); font-size: 1rem;
        }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div class="login" id="login">
        <form class="login-box" onsubmit="login(event)">
            <h2>🔐 输入访问密码</h2>
            <input type="password" id="password" placeholder="密码" autocomplete="current-password" required>
            <button class="btn" type="submit" id="loginBtn">进入</button>
            <div class="error hidden" id="loginError"></div>
        </form>
    </div>

    <div class="container hidden" id="main">
        <h1>🇫🇷 巴黎安全监控</h1>
        <div class="subtitle">过去 10 天的游行信息，按日期归类</div>

        <button class="btn" id="searchBtn" onclick="search()">🔍 查询最新信息</button>

        <div id="results"></div>

        <div class="official-links">
            <div class="section-title">📌 官方实时渠道（最权威）</div>
            <a href="https://x.com/prefpolice" target="_blank" rel="noopener">
                巴黎警察局 Préfecture de Police（X）
                <small>官方发布游行路线、禁行区域、警情</small>
            </a>
            <a href="https://www.ratp.fr/infos-trafic" target="_blank" rel="noopener">
                RATP 地铁实时交通
                <small>游行时地铁站常临时关闭，出门前看这里</small>
            </a>
            <a href="https://www.prefecturedepolice.interieur.gouv.fr/actualites-et-presse" target="_blank" rel="noopener">
                巴黎警察局官网新闻
                <small>禁止示威令（arrêté）会在这里公布</small>
            </a>
        </div>

        <div class="notice">
            新闻来自 Google 新闻聚合的媒体报道，点开可看原文。日期由标题自动提取，颜色标记是按关键词自动判断的，不代表实际危险程度，以官方渠道为准。
        </div>
    </div>

    <script>
        const STORAGE_KEY = 'paris_monitor_password';
        let password = localStorage.getItem(STORAGE_KEY);
        let data = null;

        if (password) {
            verify(password).then(ok => ok ? showMain() : localStorage.removeItem(STORAGE_KEY));
        }

        async function verify(pwd) {
            try {
                const res = await fetch('/api/login', { method: 'POST', headers: { 'X-Password': pwd } });
                return res.ok;
            } catch {
                return false;
            }
        }

        async function login(event) {
            event.preventDefault();
            const pwd = document.getElementById('password').value;
            const btn = document.getElementById('loginBtn');
            const err = document.getElementById('loginError');
            btn.disabled = true;
            err.classList.add('hidden');

            if (await verify(pwd)) {
                password = pwd;
                localStorage.setItem(STORAGE_KEY, pwd);
                showMain();
            } else {
                err.textContent = '密码错误';
                err.classList.remove('hidden');
            }
            btn.disabled = false;
        }

        function showMain() {
            document.getElementById('login').classList.add('hidden');
            document.getElementById('main').classList.remove('hidden');
            search();
        }

        async function search() {
            const btn = document.getElementById('searchBtn');
            const results = document.getElementById('results');
            btn.disabled = true;
            btn.textContent = '查询中...';
            results.innerHTML = '<div class="status">正在获取最新新闻...</div>';

            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 90000);
                const res = await fetch('/api/search', {
                    method: 'POST',
                    headers: { 'X-Password': password },
                    signal: controller.signal,
                });
                clearTimeout(timeoutId);
                if (res.status === 401) {
                    localStorage.removeItem(STORAGE_KEY);
                    location.reload();
                    return;
                }
                data = await res.json();
                if (!data.success) throw new Error(data.error || '查询失败');
                render();
            } catch (e) {
                const msg = e.name === 'AbortError' ? '请求超时，请检查网络后重试' : e.message;
                results.innerHTML = `<div class="error">⚠️ ${esc(msg)}</div>`;
            } finally {
                btn.disabled = false;
                btn.textContent = '🔍 查询最新信息';
            }
        }

        function render() {
            const events = data.events || [];
            const latest = data.latest || [];
            const html = [];

            if (events.length === 0 && latest.length === 0) {
                html.push('<div class="status">最近 10 天没有游行相关新闻</div>');
            } else {
                for (const ev of events) {
                    const badge = ev.status === 'upcoming' ? '未来游行' : ev.status === 'today' ? '今天' : '已结束';
                    const places = ev.places.length > 0 ? `<div class="places"><strong>地点：</strong>${ev.places.join('、')}</div>` : '';
                    const clash = ev.clashCount > 0 ? `🔴 ${ev.clashCount} 冲突报道` : '';
                    const meta = [
                        `📰 ${ev.articleCount} 篇报道`,
                        clash,
                    ].filter(Boolean).join(' • ');

                    const articles = ev.articles.map(a => `
                        <div class="article">
                            <a class="article-link" href="${esc(a.link)}" target="_blank" rel="noopener">
                                <div class="article-title ${a.clash ? 'clash' : ''}">${esc(a.titleZh)}</div>
                                <div class="article-meta">
                                    <span>${esc(a.source)}</span>
                                    <span>${formatTime(a.publishedAt)}</span>
                                </div>
                            </a>
                        </div>
                    `).join('');

                    html.push(`
                        <div class="event-card ${ev.status}">
                            <div class="event-header">
                                <div class="event-date">${formatDate(ev.date)}</div>
                                <div class="event-badge ${ev.status}">${badge}</div>
                            </div>
                            <div class="event-meta">${meta}</div>
                            ${places}
                            ${articles}
                        </div>
                    `);
                }

                if (latest.length > 0) {
                    html.push('<div class="latest-section"><div class="section-title">其他相关新闻</div>');
                    for (const a of latest) {
                        html.push(`
                            <div class="article">
                                <a class="article-link" href="${esc(a.link)}" target="_blank" rel="noopener">
                                    <div class="article-title ${a.clash ? 'clash' : ''}">${esc(a.titleZh)}</div>
                                    <div class="article-meta">
                                        <span>${esc(a.source)}</span>
                                        <span>${formatTime(a.publishedAt)}</span>
                                    </div>
                                </a>
                            </div>
                        `);
                    }
                    html.push('</div>');
                }
            }

            document.getElementById('results').innerHTML = html.join('');
        }

        function formatDate(d) {
            const [y, m, day] = d.split('-');
            return `${y}年${Number(m)}月${Number(day)}日`;
        }

        function formatTime(iso) {
            const d = new Date(iso);
            const now = Date.now();
            const diff = now - d.getTime();
            const h = Math.floor(diff / 3600000);
            if (h < 1) return '刚刚';
            if (h < 24) return `${h} 小时前`;
            const days = Math.floor(h / 24);
            if (days < 7) return `${days} 天前`;
            return `${d.getMonth() + 1}/${d.getDate()}`;
        }

        function esc(s) {
            const div = document.createElement('div');
            div.textContent = s;
            return div.innerHTML;
        }
    </script>
</body>
</html>
